name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ccache clang-format-14 g++ libfl2 libgoogle-perftools4 libunwind8 \
            make mold numactl zlib1g

      - name: Install locked dependencies
        run: |
          python3 scripts/setup_dependencies.py --common \
            --tool verible --tool verilator --tool sv2v --tool iverilog \
            --tool yosys --tool sby --tool bitwuzla \
            --github-path "${GITHUB_PATH}"

      - name: Run IP quality gates
        env:
          COMMON_ROOT: ${{ github.workspace }}/build/deps/common
        run: |
          make format-check register-check lint
          make test synth formal
